name: 핫딜로그 발행 상태 점검(sweep)

# auto-publish.yml은 매일 UTC 0시(한국시간 오전 9시)에 실행됩니다.
# 워드프레스닷컴 스팸 필터가 몇 분~몇십 분 뒤에 늦게 개입해서 글을
# draft로 되돌리는 경우가 있어서, 그보다 20분/40분/60분 뒤에 한 번씩
# 더 돌면서 되돌아간 글이 있으면 강제로 재발행합니다.
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "40 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: draft 되돌림 점검 및 재발행
        env:
          WPCOM_SITE: ${{ secrets.WPCOM_SITE }}
          WPCOM_ACCESS_TOKEN: ${{ secrets.WPCOM_ACCESS_TOKEN }}
        run: node scripts/sweep-drafts.js
